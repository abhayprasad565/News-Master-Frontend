<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#6E0F1E" />
  <meta name="description" content="Nikah wedding invitation" />
  <title>Wedding Invitation</title>

  <style>
    :root {
      --primary: #6e0f1e;
      --primary-dark: #38070f;
      --primary-light: #9b2639;
      --gold: #c99a42;
      --gold-light: #f0d69c;
      --cream: #fbf6ed;
      --cream-2: #efe4d6;
      --text: #402c27;
      --muted: #7b6860;
      --shadow: 0 24px 70px rgba(66, 12, 22, 0.13);
      --serif: Georgia, "Times New Roman", serif;
      --script: "Snell Roundhand", "Apple Chancery", cursive;
      --arabic: "Geeza Pro", "Noto Naskh Arabic", serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
      background: var(--cream);
    }

    body {
      min-height: 100%;
      overflow-x: hidden;
      color: var(--text);
      background:
        radial-gradient(circle at 50% 0%, rgba(255,255,255,.96), rgba(251,246,237,.94) 45%, rgba(239,228,214,.98) 100%);
      font-family: var(--serif);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    body.locked {
      overflow: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -10;
      pointer-events: none;
      opacity: .16;
      background:
        repeating-radial-gradient(circle at 20% 20%, transparent 0 18px, rgba(111,15,30,.025) 19px 20px, transparent 21px 38px);
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      font: inherit;
    }

    img {
      display: block;
      max-width: 100%;
    }

    .hidden-asset {
      display: none !important;
    }

    /* =========================
       Intro / opening screen
       ========================= */

    #intro {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: grid;
      place-items: center;
      padding: 18px;
      background:
        radial-gradient(circle at 50% 40%, rgba(161,39,56,.28), transparent 34%),
        linear-gradient(145deg, #4b0813 0%, #240308 100%);
      transition: opacity 1s ease, visibility 1s ease;
    }

    #intro.hide {
      opacity: 0;
      visibility: hidden;
    }

    .intro-glow {
      position: absolute;
      width: min(92vw, 760px);
      aspect-ratio: 1;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(238,209,143,.2), transparent 66%);
      filter: blur(16px);
      animation: breathe 4s ease-in-out infinite;
      pointer-events: none;
    }

    @keyframes breathe {
      0%,100% { transform: scale(.9); opacity: .6; }
      50% { transform: scale(1.06); opacity: 1; }
    }

    .invitation-shell {
      position: relative;
      width: min(88vw, 430px);
      max-height: 80svh;
      aspect-ratio: .72;
      perspective: 1600px;
      animation: introEnter 1.25s cubic-bezier(.16,1,.3,1);
    }

    @keyframes introEnter {
      from { opacity: 0; transform: translateY(45px) scale(.92); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .invitation-card {
      position: absolute;
      inset: 0;
      overflow: hidden;
      border-radius: 10px;
      background: #f8f0e4;
      box-shadow:
        0 38px 90px rgba(0,0,0,.55),
        0 0 0 1px rgba(237,208,141,.42);
      transform-origin: center left;
      transition: transform 1.1s cubic-bezier(.2,.9,.2,1), opacity .8s ease;
    }

    .invitation-card.opening {
      transform: rotateY(-18deg) scale(.98);
    }

    .invitation-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .intro-shade {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding-bottom: 10%;
      background: linear-gradient(180deg, transparent 45%, rgba(57,5,15,.04) 100%);
    }

    .open-button {
      appearance: none;
      min-width: 180px;
      padding: 14px 25px;
      border: 1px solid rgba(224,191,118,.75);
      border-radius: 999px;
      color: #fff6df;
      background: linear-gradient(135deg, #781427, #490914);
      box-shadow:
        0 12px 34px rgba(49,3,11,.38),
        inset 0 0 0 1px rgba(255,255,255,.1);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 2.4px;
      text-transform: uppercase;
      cursor: pointer;
      transition: transform .25s ease, box-shadow .25s ease;
      animation: buttonPulse 2.3s ease-in-out infinite;
    }

    .open-button:hover {
      transform: translateY(-2px) scale(1.02);
    }

    @keyframes buttonPulse {
      0%,100% { box-shadow: 0 12px 34px rgba(49,3,11,.38), 0 0 0 0 rgba(223,190,116,.38); }
      50% { box-shadow: 0 12px 34px rgba(49,3,11,.45), 0 0 0 12px rgba(223,190,116,0); }
    }

    /* =========================
       Floating effects
       ========================= */

    #petals {
      position: fixed;
      inset: 0;
      z-index: 900;
      overflow: hidden;
      pointer-events: none;
    }

    .petal {
      position: absolute;
      top: -50px;
      width: 14px;
      height: 22px;
      border-radius: 75% 12% 75% 12%;
      opacity: .75;
      background:
        radial-gradient(circle at 30% 30%, var(--primary-light), var(--primary) 60%, var(--primary-dark));
      animation: fall linear forwards, sway ease-in-out infinite;
      filter: drop-shadow(0 4px 4px rgba(0,0,0,.09));
    }

    @keyframes fall {
      to { top: 110vh; transform: rotate(620deg); }
    }

    @keyframes sway {
      0%,100% { margin-left: -28px; }
      50% { margin-left: 34px; }
    }

    .music-button {
      position: fixed;
      right: 18px;
      bottom: 18px;
      z-index: 600;
      display: none;
      place-items: center;
      width: 50px;
      height: 50px;
      border: 1px solid rgba(235,205,137,.65);
      border-radius: 50%;
      color: #fff3d9;
      background: color-mix(in srgb, var(--primary) 90%, transparent);
      box-shadow: 0 12px 34px rgba(0,0,0,.22);
      backdrop-filter: blur(10px);
      cursor: pointer;
    }

    .music-button.show {
      display: grid;
    }

    .music-button.playing {
      animation: musicPulse 1.8s infinite;
    }

    @keyframes musicPulse {
      50% { box-shadow: 0 0 0 9px rgba(117,16,34,.09), 0 14px 36px rgba(0,0,0,.24); }
    }

    /* =========================
       General sections
       ========================= */

    main {
      opacity: 0;
      transition: opacity 1.2s ease;
    }

    main.visible {
      opacity: 1;
    }

    section {
      position: relative;
      overflow: hidden;
      padding: clamp(82px, 10vw, 140px) 20px;
    }

    .container {
      width: min(1080px, 100%);
      margin-inline: auto;
    }

    .section-label {
      margin-bottom: 11px;
      text-align: center;
      color: var(--primary);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 4px;
      text-transform: uppercase;
    }

    .section-title {
      color: var(--primary-dark);
      text-align: center;
      font-size: clamp(40px, 7vw, 70px);
      font-weight: 500;
      line-height: 1;
    }

    .script {
      font-family: var(--script);
    }

    .divider {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 15px;
      margin: 24px auto;
    }

    .divider::before,
    .divider::after {
      content: "";
      width: 78px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
    }

    .divider span {
      color: var(--primary);
      font-size: 24px;
    }

    .reveal {
      opacity: 0;
      transform: translateY(38px);
      transition: opacity .9s ease, transform .9s cubic-bezier(.16,1,.3,1);
    }

    .reveal.show {
      opacity: 1;
      transform: translateY(0);
    }

    /* =========================
       Hero
       ========================= */

    #hero {
      min-height: 100svh;
      display: grid;
      place-items: center;
      text-align: center;
      isolation: isolate;
      padding-top: 75px;
      padding-bottom: 75px;
    }

    #hero::before {
      content: "";
      position: absolute;
      z-index: -2;
      width: min(720px, 105vw);
      aspect-ratio: 1;
      border: 1px solid color-mix(in srgb, var(--gold) 24%, transparent);
      border-radius: 50%;
      animation: haloSpin 42s linear infinite;
    }

    #hero::after {
      content: "❦";
      position: absolute;
      z-index: -3;
      color: color-mix(in srgb, var(--primary) 4%, transparent);
      font-size: min(82vw, 520px);
      transform: rotate(-10deg);
    }

    @keyframes haloSpin {
      to { transform: rotate(360deg); }
    }

    .hero-content {
      width: min(800px, 100%);
    }

    .hero-kicker {
      margin-bottom: 18px;
      color: var(--muted);
      font-size: clamp(11px, 2.1vw, 15px);
      letter-spacing: 5px;
      text-transform: uppercase;
    }

    .couple-names {
      margin: 10px 0 18px;
      color: var(--primary);
      font-family: var(--script);
      font-size: clamp(72px, 17vw, 154px);
      font-weight: 400;
      line-height: .72;
      text-shadow: 0 5px 24px color-mix(in srgb, var(--primary) 10%, transparent);
    }

    .ampersand {
      display: block;
      margin: 12px 0;
      color: var(--gold);
      font-family: var(--serif);
      font-size: clamp(32px, 6vw, 48px);
    }

    .hero-message {
      width: min(560px, 100%);
      margin: 32px auto 0;
      color: var(--muted);
      font-size: clamp(17px, 2.4vw, 21px);
      line-height: 1.75;
    }

    .scroll-indicator {
      margin-top: 58px;
      color: var(--primary);
      font-size: 10px;
      letter-spacing: 4px;
      text-transform: uppercase;
    }

    .scroll-line {
      width: 1px;
      height: 54px;
      margin: 14px auto 0;
      background: linear-gradient(var(--gold), transparent);
      animation: scrollLine 1.8s infinite;
    }

    @keyframes scrollLine {
      0% { transform: scaleY(0); transform-origin: top; }
      45% { transform: scaleY(1); transform-origin: top; }
      55% { transform: scaleY(1); transform-origin: bottom; }
      100% { transform: scaleY(0); transform-origin: bottom; }
    }

    .flower-corner {
      position: absolute;
      width: clamp(175px, 28vw, 390px);
      aspect-ratio: 1;
      pointer-events: none;
      opacity: .96;
      filter: drop-shadow(0 18px 25px rgba(71,9,18,.12));
    }

    .flower-corner::before,
    .flower-corner::after {
      content: "";
      position: absolute;
      border-radius: 60% 20% 60% 20%;
      background:
        radial-gradient(circle at 35% 30%, var(--primary-light), var(--primary) 58%, var(--primary-dark));
      box-shadow:
        70px 25px 0 -8px color-mix(in srgb, var(--primary) 88%, #fff),
        35px 80px 0 -12px var(--primary-light),
        105px 95px 0 -18px var(--primary);
    }

    .flower-corner::before {
      width: 100px;
      height: 120px;
      transform: rotate(35deg);
    }

    .flower-corner::after {
      left: 110px;
      top: 60px;
      width: 72px;
      height: 86px;
      transform: rotate(-25deg);
    }

    .flower-top {
      left: -25px;
      top: -15px;
    }

    .flower-bottom {
      right: -80px;
      bottom: 20px;
      transform: rotate(180deg);
    }

    /* =========================
       Blessing
       ========================= */

    #blessing {
      text-align: center;
      background: linear-gradient(180deg, rgba(255,255,255,.28), rgba(246,236,222,.62));
    }

    .arabic {
      margin-bottom: 18px;
      color: var(--primary);
      font-family: var(--arabic);
      font-size: clamp(34px, 7vw, 58px);
      line-height: 1.6;
    }

    .translation {
      color: var(--muted);
      font-size: 19px;
      line-height: 1.7;
    }

    /* =========================
       Family card
       ========================= */

    .family-card {
      position: relative;
      width: min(760px, 100%);
      margin: 48px auto 0;
      padding: clamp(36px, 8vw, 70px) clamp(23px, 7vw, 66px);
      text-align: center;
      border: 1px solid color-mix(in srgb, var(--gold) 35%, transparent);
      background: rgba(255,252,246,.78);
      box-shadow: var(--shadow);
      backdrop-filter: blur(8px);
    }

    .family-card::before {
      content: "";
      position: absolute;
      inset: 10px;
      border: 1px solid color-mix(in srgb, var(--primary) 12%, transparent);
      pointer-events: none;
    }

    .family-intro {
      color: var(--muted);
      font-size: 18px;
      line-height: 1.75;
    }

    .person {
      margin: 34px 0;
    }

    .person-name {
      color: var(--primary);
      font-family: var(--script);
      font-size: clamp(56px, 10vw, 90px);
      line-height: 1;
    }

    .parents {
      margin-top: 8px;
      color: var(--muted);
      font-size: 17px;
    }

    .with {
      color: var(--gold);
      font-size: 25px;
      font-style: italic;
    }

    /* =========================
       Scratch / date reveal
       ========================= */

    #save-the-date {
      text-align: center;
    }

    .scratch-wrapper {
      width: min(500px, 100%);
      margin: 45px auto 0;
    }

    .scratch-instruction {
      margin-bottom: 14px;
      color: var(--muted);
      font-size: 11px;
      letter-spacing: 4px;
      text-transform: uppercase;
    }

    .scratch-card {
      position: relative;
      width: 100%;
      aspect-ratio: 1.55;
      overflow: hidden;
      border-radius: 24px;
      box-shadow: 0 25px 60px color-mix(in srgb, var(--primary) 20%, transparent);
      user-select: none;
      touch-action: none;
    }

    .date-behind {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #fff8e7;
      background:
        radial-gradient(circle at 50% 0%, var(--primary-light), var(--primary) 58%, var(--primary-dark) 100%);
    }

    .weekday {
      color: var(--gold-light);
      font-size: 12px;
      letter-spacing: 5px;
    }

    .date-main {
      display: flex;
      align-items: center;
      gap: 18px;
      margin: 16px 0;
    }

    .date-day {
      font-size: clamp(58px, 14vw, 92px);
      line-height: .8;
    }

    .date-month-year {
      text-align: left;
    }

    .date-month {
      color: var(--gold-light);
      font-size: 27px;
      letter-spacing: 5px;
    }

    .date-year {
      margin-top: 3px;
      font-size: 17px;
      letter-spacing: 7px;
    }

    .save-text {
      font-family: var(--script);
      font-size: 38px;
    }

    #scratchCanvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      cursor: grab;
    }

    #scratchCanvas:active {
      cursor: grabbing;
    }

    .countdown {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      width: min(760px, 100%);
      margin: 54px auto 0;
      border-top: 1px solid color-mix(in srgb, var(--gold) 28%, transparent);
      border-bottom: 1px solid color-mix(in srgb, var(--gold) 28%, transparent);
    }

    .countdown-item {
      padding: 24px 8px;
    }

    .countdown-item + .countdown-item {
      border-left: 1px solid color-mix(in srgb, var(--gold) 18%, transparent);
    }

    .countdown-number {
      display: block;
      color: var(--primary);
      font-size: clamp(35px, 7vw, 58px);
      line-height: 1;
    }

    .countdown-label {
      display: block;
      margin-top: 8px;
      color: var(--muted);
      font-size: 10px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    /* =========================
       Events
       ========================= */

    #events {
      color: #fff;
      background:
        radial-gradient(circle at 50% 0%, color-mix(in srgb, var(--primary-light) 42%, transparent), transparent 35%),
        linear-gradient(145deg, var(--primary), var(--primary-dark));
    }

    #events .section-label {
      color: var(--gold-light);
    }

    #events .section-title {
      color: #fff8e7;
    }

    .event-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      margin-top: 52px;
    }

    .event-card {
      position: relative;
      overflow: hidden;
      padding: 38px 25px;
      text-align: center;
      border: 1px solid rgba(238,206,137,.28);
      border-radius: 18px;
      background: linear-gradient(180deg, rgba(255,255,255,.07), rgba(255,255,255,.02));
      backdrop-filter: blur(10px);
      transition: transform .4s ease, border-color .4s ease;
    }

    .event-card:hover {
      transform: translateY(-7px);
      border-color: rgba(238,206,137,.7);
    }

    .event-icon {
      margin-bottom: 15px;
      color: var(--gold-light);
      font-size: 30px;
    }

    .event-name {
      font-family: var(--script);
      font-size: 49px;
      font-weight: 400;
    }

    .event-date {
      margin-top: 4px;
      color: rgba(255,255,255,.7);
      font-size: 13px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .event-time {
      margin: 14px 0 10px;
      color: var(--gold-light);
      font-size: 18px;
      letter-spacing: 2px;
    }

    .event-venue {
      margin-top: 14px;
      font-size: 19px;
      font-weight: 600;
    }

    .event-address {
      margin-top: 6px;
      color: rgba(255,255,255,.72);
      line-height: 1.5;
    }

    .map-button {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      margin-top: 24px;
      padding: 11px 20px;
      border: 1px solid rgba(235,202,130,.5);
      border-radius: 999px;
      color: var(--gold-light);
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
      transition: .25s ease;
    }

    .map-button:hover {
      color: var(--primary-dark);
      background: var(--gold-light);
    }

    /* =========================
       Timeline
       ========================= */

    .timeline {
      width: min(650px, 100%);
      margin: 54px auto 0;
    }

    .timeline-item {
      display: grid;
      grid-template-columns: 105px 30px 1fr;
      min-height: 100px;
    }

    .timeline-time {
      padding-top: 3px;
      color: var(--primary);
      text-align: right;
      font-size: 16px;
      font-weight: 600;
    }

    .timeline-marker {
      position: relative;
      display: flex;
      justify-content: center;
    }

    .timeline-marker::before {
      content: "";
      position: absolute;
      top: 13px;
      bottom: -10px;
      width: 1px;
      background: linear-gradient(var(--gold), color-mix(in srgb, var(--gold) 15%, transparent));
    }

    .timeline-item:last-child .timeline-marker::before {
      display: none;
    }

    .timeline-dot {
      position: relative;
      width: 10px;
      height: 10px;
      margin-top: 7px;
      border-radius: 50%;
      background: var(--primary);
      box-shadow: 0 0 0 5px color-mix(in srgb, var(--primary) 10%, transparent);
    }

    .timeline-content {
      padding-left: 15px;
    }

    .timeline-content h3 {
      color: var(--primary-dark);
      font-size: 23px;
      font-weight: 600;
    }

    .timeline-content p {
      margin-top: 4px;
      color: var(--muted);
      line-height: 1.6;
    }

    /* =========================
       Dua
       ========================= */

    #dua {
      padding-top: 100px;
      padding-bottom: 100px;
      text-align: center;
      background: linear-gradient(rgba(253,248,238,.83), rgba(253,248,238,.83));
    }

    .dua-arabic {
      color: var(--primary);
      font-family: var(--arabic);
      font-size: clamp(30px, 6vw, 48px);
      line-height: 1.8;
    }

    .dua-translation {
      width: min(600px, 100%);
      margin: 18px auto 0;
      color: var(--muted);
      font-size: 18px;
      line-height: 1.7;
    }

    /* =========================
       RSVP
       ========================= */

    #rsvp {
      text-align: center;
    }

    .rsvp-box {
      width: min(700px, 100%);
      margin: 45px auto 0;
      padding: clamp(35px, 7vw, 65px) 20px;
      border: 1px solid color-mix(in srgb, var(--gold) 25%, transparent);
      border-radius: 24px;
      background: rgba(255,255,255,.58);
      box-shadow: 0 30px 80px rgba(92,42,26,.08);
      backdrop-filter: blur(12px);
    }

    .rsvp-question {
      margin-bottom: 27px;
      color: var(--muted);
      font-size: 21px;
    }

    .rsvp-buttons {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
    }

    .rsvp-button {
      padding: 14px 24px;
      border: 1px solid var(--primary);
      border-radius: 999px;
      font-size: 12px;
      letter-spacing: 1px;
      cursor: pointer;
      transition: .25s ease;
    }

    .rsvp-yes {
      color: white;
      background: var(--primary);
    }

    .rsvp-no {
      color: var(--primary);
      background: transparent;
    }

    .rsvp-button:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 30px color-mix(in srgb, var(--primary) 16%, transparent);
    }

    .rsvp-note {
      margin-top: 24px;
      color: var(--muted);
    }

    /* =========================
       Footer
       ========================= */

    footer {
      position: relative;
      overflow: hidden;
      padding: 85px 20px 40px;
      color: #fff6e6;
      text-align: center;
      background: linear-gradient(160deg, var(--primary), var(--primary-dark));
    }

    .footer-names {
      color: var(--gold-light);
      font-family: var(--script);
      font-size: clamp(58px, 11vw, 90px);
    }

    .footer-message {
      width: min(480px, 100%);
      margin: 15px auto;
      color: rgba(255,255,255,.75);
      line-height: 1.7;
    }

    .footer-ornament {
      margin: 25px 0;
      color: var(--gold-light);
      font-size: 28px;
    }

    .footer-small {
      color: rgba(255,255,255,.45);
      font-size: 10px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    /* =========================
       Mobile
       ========================= */

    @media (max-width: 620px) {
      .countdown {
        grid-template-columns: repeat(2, 1fr);
      }

      .countdown-item:nth-child(3) {
        border-left: none;
        border-top: 1px solid color-mix(in srgb, var(--gold) 18%, transparent);
      }

      .countdown-item:nth-child(4) {
        border-top: 1px solid color-mix(in srgb, var(--gold) 18%, transparent);
      }

      .timeline-item {
        grid-template-columns: 74px 25px 1fr;
      }

      .flower-corner {
        opacity: .72;
      }

      .invitation-shell {
        max-height: 76svh;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }

      html {
        scroll-behavior: auto;
      }
    }
  </style>
</head>

    /* -----------------------------
       Scroll reveal
       ----------------------------- */

    function observeAnimations() {
      const elements = document.querySelectorAll(".reveal:not(.show)");

      if (!("IntersectionObserver" in window)) {
        elements.forEach(el => el.classList.add("show"));
        return;
      }

      const observer = new IntersectionObserver(entries => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            entry.target.classList.add("show");
            observer.unobserve(entry.target);
          }
        });
      }, {
        threshold: .12,
        rootMargin: "0px 0px -20px 0px"
      });

      elements.forEach(el => observer.observe(el));
    }


    /* -----------------------------
       Countdown
       ----------------------------- */

    function updateCountdown() {
      const target = weddingDateObject.getTime();
      const now = Date.now();

      if (Number.isNaN(target)) {
        return;
      }

      let distance = target - now;

      if (distance <= 0) {
        $("days").textContent = "00";
        $("hours").textContent = "00";
        $("minutes").textContent = "00";
        $("seconds").textContent = "00";
        return;
      }

      const dayMs = 1000 * 60 * 60 * 24;
      const hourMs = 1000 * 60 * 60;
      const minuteMs = 1000 * 60;

      const days = Math.floor(distance / dayMs);
      distance %= dayMs;

      const hours = Math.floor(distance / hourMs);
      distance %= hourMs;

      const minutes = Math.floor(distance / minuteMs);
      distance %= minuteMs;

      const seconds = Math.floor(distance / 1000);

      $("days").textContent = String(days).padStart(2, "0");
      $("hours").textContent = String(hours).padStart(2, "0");
      $("minutes").textContent = String(minutes).padStart(2, "0");
      $("seconds").textContent = String(seconds).padStart(2, "0");
    }

    /* -----------------------------
       Scratch card
       ----------------------------- */

    const scratchCanvas = $("scratchCanvas");
    const scratchCard = $("scratchCard");

    let scratchContext;
    let scratching = false;
    let scratchMoves = 0;
    let scratchCompleted = false;

    function setupScratchCard() {
      if (scratchCompleted) {
        return;
      }

      const rect = scratchCard.getBoundingClientRect();

      if (!rect.width || !rect.height) {
        return;
      }

      const ratio = Math.max(1, Math.min(window.devicePixelRatio || 1, 2));

      scratchCanvas.width = Math.round(rect.width * ratio);
      scratchCanvas.height = Math.round(rect.height * ratio);
      scratchCanvas.style.width = `${rect.width}px`;
      scratchCanvas.style.height = `${rect.height}px`;

      scratchContext = scratchCanvas.getContext("2d");
      scratchContext.setTransform(ratio, 0, 0, ratio, 0, 0);

      const gradient = scratchContext.createLinearGradient(0, 0, rect.width, rect.height);
      gradient.addColorStop(0, PRIMARY_COLOR);
      gradient.addColorStop(.5, PRIMARY_LIGHT_COLOR);
      gradient.addColorStop(1, PRIMARY_DARK_COLOR);

      scratchContext.globalCompositeOperation = "source-over";
      scratchContext.fillStyle = gradient;
      scratchContext.fillRect(0, 0, rect.width, rect.height);

      scratchContext.strokeStyle = GOLD_LIGHT_COLOR;
      scratchContext.lineWidth = 2;
      scratchContext.strokeRect(11, 11, rect.width - 22, rect.height - 22);

      scratchContext.textAlign = "center";
      scratchContext.textBaseline = "middle";
      scratchContext.fillStyle = GOLD_LIGHT_COLOR;

      scratchContext.font = "600 14px Georgia, serif";
      scratchContext.fillText("SCRATCH TO REVEAL", rect.width / 2, rect.height / 2 - 10);

      scratchContext.font = "28px Georgia, serif";
      scratchContext.fillText("✦", rect.width / 2, rect.height / 2 + 28);
    }

    function scratchAt(event) {
      if (!scratching || !scratchContext || scratchCompleted) {
        return;
      }

      const rect = scratchCanvas.getBoundingClientRect();
      const x = event.clientX - rect.left;
      const y = event.clientY - rect.top;

      scratchContext.globalCompositeOperation = "destination-out";
      scratchContext.beginPath();
      scratchContext.arc(x, y, 28, 0, Math.PI * 2);
      scratchContext.fill();

      scratchMoves += 1;

      if (scratchMoves > 78) {
        scratchCompleted = true;
        scratchCanvas.style.transition = "opacity .8s ease";
        scratchCanvas.style.opacity = "0";

        setTimeout(() => {
          scratchCanvas.style.display = "none";
        }, 820);

        createPetalBurst();
      }
    }

    scratchCanvas.addEventListener("pointerdown", event => {
      scratching = true;

      try {
        scratchCanvas.setPointerCapture(event.pointerId);
      } catch (_) {}

      scratchAt(event);
    });

    scratchCanvas.addEventListener("pointermove", scratchAt);

    scratchCanvas.addEventListener("pointerup", () => {
      scratching = false;
    });

    scratchCanvas.addEventListener("pointercancel", () => {
      scratching = false;
    });

      petal.style.opacity = String(Math.random() * .45 + .3);

      petalContainer.appendChild(petal);

      setTimeout(() => petal.remove(), duration * 1000);
    }

    function createPetalBurst() {

    const musicButton = $("musicButton");

    function setupMusic() {
      if (!MUSIC_ENABLED) {
        return;
      }

      music.src = MUSIC_FILE;
      musicButton.classList.add("show");

      musicButton.addEventListener("click", () => {
        if (music.paused) {
          playMusic();
        } else {
          music.pause();
          musicButton.classList.remove("playing");
          musicButton.textContent = "♫";
        }
      });
    }

    async function playMusic() {
      try {
        await music.play();
        musicButton.classList.add("playing");
        musicButton.textContent = "❚❚";
      } catch (_) {
        // Browsers may block autoplay until the user taps again.
      }
    }


    /* -----------------------------
       Decorative parallax
       ----------------------------- */

    window.addEventListener("scroll", () => {
      const amount = window.scrollY * .035;

      document.querySelectorAll(".flower-corner").forEach((flower, index) => {
        const direction = index % 2 === 0 ? 1 : -1;
        flower.style.translate = `0 ${amount * direction}px`;
      });
    }, { passive: true });


    /* -----------------------------
       Initialise
       ----------------------------- */

    applyWeddingDetails();

    window.addEventListener("load", () => {
      setupScratchCard();
    });

    window.addEventListener("resize", () => {
      if (!scratchCompleted) {
        setupScratchCard();
      }
    });

  </script>
</body>
</html>
