<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, minimum-scale=1.0, viewport-fit=cover"
    />
    <title>ScrollBrief — News, Briefly</title>
    <meta
      name="description"
      content="Concise, verified news summaries with source attribution. Latest stories on politics, economy, technology, and more — ScrollBrief."
    />
    <link rel="canonical" href="https://scrollbrief.in/" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph -->
    <meta property="og:site_name" content="ScrollBrief" />
    <meta property="og:title" content="ScrollBrief — News, Briefly" />
    <meta
      property="og:description"
      content="Concise, verified news summaries with source attribution. Latest stories on politics, economy, technology, and more."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://scrollbrief.in/" />
    <meta property="og:image" content="https://scrollbrief.in/logo.png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:locale" content="en_IN" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@scrollbrief_in" />
    <meta name="twitter:title" content="ScrollBrief — News, Briefly" />
    <meta
      name="twitter:description"
      content="Concise, verified news summaries with source attribution."
    />
    <meta name="twitter:image" content="https://scrollbrief.in/logo.png" />

    <!-- JSON-LD: WebSite -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "ScrollBrief",
      "url": "https://scrollbrief.in/",
      "description": "Concise, verified news summaries with source attribution.",
      "potentialAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "https://scrollbrief.in/stories?q={search_term_string}"
        },
        "query-input": "required name=search_term_string"
      }
    }
    </script>

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
